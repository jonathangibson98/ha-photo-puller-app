name: "Photo Puller"
version: "1.2.2"
slug: photo_puller
description: "Pulls random Unsplash photos for collections you manage in a web UI (city, ocean, whatever) and tells Home Assistant when a new one lands"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:image-multiple
panel_title: "Photo Puller"
map:
  - share:rw
options:
  unsplash_access_key: ""
  interval_minutes: 60
  image_size: "regular"
schema:
  unsplash_access_key: password
  interval_minutes: int(5,1440)
  image_size: list(full|regular|small)
